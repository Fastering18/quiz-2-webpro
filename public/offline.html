<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus - myITS Classroom</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #001A3D 0%, #00337F 100%);
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .offline-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }
        .icon-wrapper {
            width: 72px;
            height: 72px;
            background: rgba(244, 162, 40, 0.15);
            border: 2px solid rgba(244, 162, 40, 0.4);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .icon-wrapper svg {
            color: #F4A228;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #FFFFFF;
        }
        p {
            font-size: 14px;
            color: #CBD5E1;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn-reload {
            background: #F4A228;
            color: #002B66;
            border: none;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reload:hover {
            background: #FFB833;
            transform: translateY(-1px);
        }
        .btn-home {
            background: transparent;
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-home:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .brand-footer {
            margin-top: 32px;
            font-size: 12px;
            color: #94A3B8;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="icon-wrapper">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1>Anda Sedang Offline</h1>
        <p>Tidak ada koneksi internet yang terdeteksi. Silakan periksa koneksi Wi-Fi atau data seluler Anda, lalu coba lagi.</p>
        <div class="actions">
            <button class="btn-reload" onclick="window.location.reload()">Coba Muat Ulang</button>
            <a href="/" class="btn-home">Kembali ke Halaman Masuk</a>
        </div>
        <div class="brand-footer">myITS Classroom &bull; Institut Teknologi Sepuluh Nopember</div>
    </div>
</body>
</html>
