services:
  - type: web
    name: quiz-2-webpro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Quiz2WebPro
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      # File sessions vanish when the Render disk restarts, which leaves logout and CSRF stuck.
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: "true"
      - key: QUEUE_CONNECTION
        value: sync
      # Resend API first, then direct delivery to the recipient mail server.
      - key: MAIL_MAILER
        value: failover
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: support@brahmanapriambudi.my.id
      - key: MAIL_FROM_NAME
        value: Portal Quiz 2 WebPro
      - key: FRONTEND_URL
        sync: false
      - key: OCTANE_SERVER
        value: frankenphp
      - key: OCTANE_HTTPS
        value: "true"
      - key: OCTANE_WORKERS
        value: "1"
