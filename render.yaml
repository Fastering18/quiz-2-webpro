services:
  - type: web
    name: quiz-2-webpro
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Quiz2WebPro
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      # The browser UI needs persistent sessions (table `sessions` exists)
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # Forgot-password mail over plain SMTP. MAIL_MAILER=log (default) only logs the mail.
      - key: MAIL_MAILER # unset = log; set to smtp together with the credentials below
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_SCHEME
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: support@brahmanapriambudi.my.id
      - key: MAIL_FROM_NAME
        value: Portal Quiz 2 WebPro
      - key: FRONTEND_URL
        sync: false
