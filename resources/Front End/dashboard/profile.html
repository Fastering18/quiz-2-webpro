<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Profil - myITS Classroom</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="components.js"></script>
</head>
<body>

    <my-topbar></my-topbar>

    <div class="layout-container">
        <my-sidebar active="profile"></my-sidebar>

        <main class="main-content">
            <div class="view-section">

                <div class="page-header">
                    <h2>Pengaturan Profil</h2>
                    <p>Kelola informasi pribadi dan preferensi akun Anda.</p>
                </div>

                <!-- ============================================
                     CARD 1: Informasi Pribadi
                     ============================================ -->
                <div class="profile-card">

                    <!-- Foto Profil -->
                    <div class="profile-photo-section">
                        <img src="https://placehold.co/80x80" alt="Foto Profil" class="profile-large-avatar" id="profile-page-avatar">
                        <div class="photo-actions">
                            <button class="btn-primary-small">Ganti Foto</button>
                            <span class="photo-hint">Ukuran maksimal 2MB. Format JPG atau PNG.</span>
                        </div>
                    </div>

                    <!-- Data Akademik (Read-only, diisi JS via simulasi API) -->
                    <h3 class="section-title">Data Akademik</h3>
                    <div class="form-grid">
                        <div class="input-group">
                            <label for="profile-name">Nama Lengkap</label>
                            <input type="text" id="profile-name" value="Nama Mahasiswa" class="input-readonly" disabled>
                        </div>
                        <div class="input-group">
                            <label for="profile-nrp">NRP</label>
                            <input type="text" id="profile-nrp" value="NRP Mahasiswa" class="input-readonly" disabled>
                        </div>
                        <div class="input-group">
                            <label for="profile-dept">Jurusan</label>
                            <input type="text" id="profile-dept" value="Departemen" class="input-readonly" disabled>
                        </div>
                        <div class="input-group">
                            <label for="profile-email">Email</label>
                            <input type="email" id="profile-email" value="email@its.ac.id" class="input-readonly" disabled>
                        </div>
                        <div class="input-group">
                            <label>Dosen Wali</label>
                            <input type="text" value="Dr. Dosen, S.Kom. M.T" class="input-readonly" disabled>
                        </div>
                    </div>

                    <!-- Data Kontak (Editable) -->
                    <h3 class="section-title">Informasi Kontak</h3>
                    <div class="form-grid">
                        <div class="input-group">
                            <label for="phone">Nomor Telepon</label>
                            <input type="text" id="phone" placeholder="08xx-xxxx-xxxx">
                        </div>
                        <div class="input-group">
                            <label for="address">Alamat Rumah</label>
                            <input type="text" id="address" placeholder="Jl. Raya ITS, Surabaya">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button class="btn-primary-small" type="button">Simpan Perubahan</button>
                    </div>

                </div>

                <!-- ============================================
                     CARD 2: Ganti Password
                     ============================================ -->
                <div class="profile-card">
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00337F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <h3 class="section-title" style="margin-top:0;">Ganti Kata Sandi</h3>
                    </div>
                    <p style="font-size:13px; color:#64748B; margin-bottom:4px;">
                        Untuk keamanan akun, jangan gunakan sandi yang sama di beberapa platform.
                    </p>

                    <div class="password-section">
                        <form id="changePasswordForm" novalidate>

                            <!-- Grid 3 kolom: sandi lama | sandi baru | konfirmasi -->
                            <div class="password-grid">

                                <!-- Sandi Lama -->
                                <div class="input-group">
                                    <label for="oldPassword">Sandi Lama</label>
                                    <div class="password-input-wrapper">
                                        <input type="password" id="oldPassword"
                                            placeholder="Masukkan sandi saat ini"
                                            autocomplete="current-password">
                                        <button type="button" class="toggle-pass-visibility"
                                            aria-label="Tampilkan sandi">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                                <circle cx="12" cy="12" r="3"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                                <!-- Sandi Baru -->
                                <div class="input-group">
                                    <label for="newPassword">Sandi Baru</label>
                                    <div class="password-input-wrapper">
                                        <input type="password" id="newPassword"
                                            placeholder="Minimal 8 karakter"
                                            autocomplete="new-password">
                                        <button type="button" class="toggle-pass-visibility"
                                            aria-label="Tampilkan sandi">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                                <circle cx="12" cy="12" r="3"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <span class="password-hint">Minimal 8 karakter, kombinasi huruf &amp; angka.</span>
                                </div>

                                <!-- Konfirmasi Sandi Baru -->
                                <div class="input-group">
                                    <label for="confirmPassword">Konfirmasi Sandi Baru</label>
                                    <div class="password-input-wrapper">
                                        <input type="password" id="confirmPassword"
                                            placeholder="Ulangi sandi baru"
                                            autocomplete="new-password">
                                        <button type="button" class="toggle-pass-visibility"
                                            aria-label="Tampilkan sandi">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                                <circle cx="12" cy="12" r="3"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>

                            </div><!-- /password-grid -->

                            <!-- Feedback Message (diisi JS) -->
                            <p class="classroom-feedback" id="passwordFeedback" role="status" aria-live="polite"></p>

                            <div class="form-actions">
                                <button type="button" class="btn-secondary"
                                    onclick="document.getElementById('changePasswordForm').reset(); document.getElementById('passwordFeedback').className='classroom-feedback'; document.getElementById('passwordFeedback').textContent='';">
                                    Batal
                                </button>
                                <button type="submit" class="btn-primary-small">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <polyline points="20 6 9 17 4 12"/>
                                    </svg>
                                    Simpan Sandi Baru
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
