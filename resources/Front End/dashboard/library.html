<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan - myITS Classroom</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="dashboard.css">
    <script src="components.js"></script>
</head>
<body>
    
    <!-- Memanggil Top Bar -->
    <my-topbar></my-topbar>

    <div class="layout-container">
        
        <!-- Sidebar diset aktif pada 'library' -->
        <my-sidebar active="library"></my-sidebar>

        <main class="main-content">
            <div class="view-section">
                
                <div class="library-card">
                    <!-- HEADER: Judul & Pencarian -->
                    <div class="library-header">
                        <div class="library-title">
                            <div class="icon-wrapper">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00337F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                            </div>
                            <h2>Perpustakaan</h2>
                        </div>
                        
                        <div class="search-bar">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" placeholder="Cari judul buku..." id="searchInput">
                        </div>
                    </div>

                    <!-- TABEL BUKU -->
                    <div class="library-table-container">
                        
                        <!-- Header Tabel -->
                        <div class="lib-table-header">
                            <div class="col-no">No.</div>
                            <div class="col-title">Judul Buku</div>
                            <div class="col-action">Aksi</div>
                        </div>

                        <!-- 
                            ======================================================
                            TEMPLATE BARIS DATA (REFERENSI UNTUK BACKEND / JS MAP)
                            ======================================================
                        -->
                        <div class="lib-table-row">
                            <div class="col-no">1</div>
                            <div class="col-title">
                                <div class="book-cover-icon">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
                                </div>
                                <span class="book-name">Introduction to Algorithms</span>
                            </div>
                            <div class="col-action">
                                <button class="btn-primary-small">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                    Unduh
                                </button>
                            </div>
                        </div>
                        <!-- Akhir Template Baris Data -->

                    </div>

                    <!-- PAGINASI -->
                    <div class="pagination-wrapper">
                        <button class="page-btn">Sebelumnya</button>
                        <button class="page-btn active">1</button>
                        <button class="page-btn">2</button>
                        <button class="page-btn">3</button>
                        <button class="page-btn">Berikutnya</button>
                    </div>

                </div>

            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
