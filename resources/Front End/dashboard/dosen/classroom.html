<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Dosen - myITS Classroom</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../dashboard.css">
    <script src="components.js"></script>
</head>
<body>

    <my-topbar></my-topbar>

    <div class="layout-container">
        <my-sidebar active="classroom"></my-sidebar>

        <main class="main-content">
            <div class="view-section">

                <!-- ================================================
                     PAGE HEADER
                ================================================ -->
                <div class="page-header-row">
                    <div class="header-text-group">
                        <h2>Classroom Saya</h2>
                        <p>Kelola pengumuman, section, materi, dan tugas untuk setiap kelas yang Anda ampu.</p>
                    </div>
                    <button class="btn-primary-small" id="btnTambahKelas">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Tambah Kelas
                    </button>
                </div>

                <!-- ================================================
                     DAFTAR KELAS — dirender dosen.js
                     Struktur per kelas:
                       .dc-card
                         .dc-card-header  → toggle expand
                         .dc-card-body
                           .dc-tabs       → tab: Pengumuman | Section | Kiriman
                           .dc-tab-panel  (satu per tab)
                ================================================ -->
                <div class="dc-list" id="dosenClassList"></div>

            </div>
        </main>
    </div>

    <!-- ========================================================
         MODAL: Tambah / Edit PENGUMUMAN
    ======================================================== -->
    <div class="modal-overlay" id="modalPengumuman" role="dialog" aria-modal="true" aria-labelledby="modalPengumumanTitle">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalPengumumanTitle">Tambah Pengumuman</h3>
                <button class="modal-close" data-close-modal="modalPengumuman" aria-label="Tutup">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editPengumumanId">
                <div class="form-group">
                    <label for="inputPengumumanJudul">Judul Pengumuman</label>
                    <input type="text" id="inputPengumumanJudul" class="form-input" placeholder="cth: Jadwal UTS diubah">
                </div>
                <div class="form-group">
                    <label for="inputPengumumanIsi">Isi Pengumuman</label>
                    <textarea id="inputPengumumanIsi" class="form-textarea" rows="5" placeholder="Tulis detail pengumuman..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close-modal="modalPengumuman">Batal</button>
                <button class="btn-primary-small" id="btnSavePengumuman">Simpan</button>
            </div>
        </div>
    </div>

    <!-- ========================================================
         MODAL: Tambah SECTION
    ======================================================== -->
    <div class="modal-overlay" id="modalSection" role="dialog" aria-modal="true" aria-labelledby="modalSectionTitle">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalSectionTitle">Tambah Section</h3>
                <button class="modal-close" data-close-modal="modalSection" aria-label="Tutup">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="inputSectionNama">Nama Section / Pertemuan</label>
                    <input type="text" id="inputSectionNama" class="form-input" placeholder="cth: Pertemuan 3 — Rekursi">
                </div>
                <div class="form-group">
                    <label for="inputSectionTanggal">Tanggal (opsional)</label>
                    <input type="date" id="inputSectionTanggal" class="form-input">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close-modal="modalSection">Batal</button>
                <button class="btn-primary-small" id="btnSaveSection">Tambah Section</button>
            </div>
        </div>
    </div>

    <!-- ========================================================
         MODAL: Tambah MATERI
         Materi = judul teks + deskripsi + daftar source file
    ======================================================== -->
    <div class="modal-overlay" id="modalMateri" role="dialog" aria-modal="true" aria-labelledby="modalMateriTitle">
        <div class="modal-box" style="max-width:620px;">
            <div class="modal-header">
                <h3 id="modalMateriTitle">Tambah Materi</h3>
                <button class="modal-close" data-close-modal="modalMateri" aria-label="Tutup">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editMateriId">
                <div class="form-group">
                    <label for="inputMateriJudul">Judul Materi</label>
                    <input type="text" id="inputMateriJudul" class="form-input" placeholder="cth: Pengantar Algoritma">
                </div>
                <div class="form-group">
                    <label for="inputMateriIsi">Isi / Deskripsi</label>
                    <textarea id="inputMateriIsi" class="form-textarea" rows="4" placeholder="Tuliskan penjelasan, ringkasan, atau instruksi baca untuk mahasiswa..."></textarea>
                </div>
                <!-- Daftar Source File -->
                <div class="form-group">
                    <label>File Sumber (Source)</label>
                    <div class="source-input-list" id="sourceInputList">
                        <!-- Baris source dirender JS -->
                    </div>
                    <button type="button" class="btn-add-content" id="btnAddSourceRow" style="margin-top:8px;">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                        Tambah File
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close-modal="modalMateri">Batal</button>
                <button class="btn-primary-small" id="btnSaveMateri">Simpan Materi</button>
            </div>
        </div>
    </div>

    <!-- ========================================================
         MODAL: Tambah TUGAS
    ======================================================== -->
    <div class="modal-overlay" id="modalTugas" role="dialog" aria-modal="true" aria-labelledby="modalTugasTitle">
        <div class="modal-box" style="max-width:620px;">
            <div class="modal-header">
                <h3 id="modalTugasTitle">Tambah Tugas</h3>
                <button class="modal-close" data-close-modal="modalTugas" aria-label="Tutup">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editTugasId">
                <div class="form-group">
                    <label for="inputTugasJudul">Judul Tugas</label>
                    <input type="text" id="inputTugasJudul" class="form-input" placeholder="cth: Praktikum 2 — Implementasi Stack">
                </div>
                <div class="form-group">
                    <label for="inputTugasDeskripsi">Deskripsi / Instruksi</label>
                    <textarea id="inputTugasDeskripsi" class="form-textarea" rows="4" placeholder="Jelaskan instruksi tugas kepada mahasiswa..."></textarea>
                </div>
                <div class="form-grid" style="gap:12px;">
                    <div class="form-group">
                        <label for="inputTugasDue">Batas Pengumpulan</label>
                        <input type="datetime-local" id="inputTugasDue" class="form-input">
                    </div>
                    <div class="form-group">
                        <label>Format File yang Diterima</label>
                        <!-- Chip-select: pilih satu atau lebih format -->
                        <div class="file-format-picker" id="fileFormatPicker">
                            <button type="button" class="fmt-chip" data-fmt=".pdf">PDF</button>
                            <button type="button" class="fmt-chip" data-fmt=".doc">.DOC</button>
                            <button type="button" class="fmt-chip" data-fmt=".zip">.ZIP</button>
                            <button type="button" class="fmt-chip" data-fmt=".c">.C</button>
                            <button type="button" class="fmt-chip" data-fmt=".py">.PY</button>
                            <button type="button" class="fmt-chip" data-fmt=".java">.JAVA</button>
                            <button type="button" class="fmt-chip" data-fmt=".txt">.TXT</button>
                            <button type="button" class="fmt-chip" data-fmt=".mp4">.MP4</button>
                            <button type="button" class="fmt-chip fmt-chip-any" data-fmt="*">Semua</button>
                        </div>
                        <p style="font-size:11px;color:#94A3B8;margin-top:6px;">
                            Dipilih: <span id="selectedFormatsLabel">—</span>
                        </p>
                        <!-- Hidden input yang menyimpan nilai akhir untuk dosen.js -->
                        <input type="hidden" id="inputTugasTipe">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close-modal="modalTugas">Batal</button>
                <button class="btn-primary-small" id="btnSaveTugas">Simpan Tugas</button>
            </div>
        </div>
    </div>

    <!-- ========================================================
         MODAL: KONFIRMASI HAPUS
    ======================================================== -->
    <div class="modal-overlay" id="modalKonfirmasiHapus" role="dialog" aria-modal="true" aria-labelledby="modalHapusTitle">
        <div class="modal-box" style="max-width:440px;">
            <div class="modal-header">
                <h3 id="modalHapusTitle">Konfirmasi Hapus</h3>
                <button class="modal-close" data-close-modal="modalKonfirmasiHapus" aria-label="Tutup">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="hapus-confirm-icon" aria-hidden="true">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                </div>
                <p class="hapus-confirm-text" id="hapusConfirmText">Apakah Anda yakin ingin menghapus item ini? Tindakan ini tidak dapat dibatalkan.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close-modal="modalKonfirmasiHapus">Batal, Jangan Hapus</button>
                <button class="btn-danger" id="btnKonfirmasiHapus">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <!-- ========================================================
         MODAL: DETAIL KIRIMAN MAHASISWA
    ======================================================== -->
    <div class="modal-overlay" id="modalKiriman" role="dialog" aria-modal="true" aria-labelledby="modalKirimanTitle">
        <div class="modal-box" style="max-width:580px;">
            <div class="modal-header">
                <h3 id="modalKirimanTitle">Detail Kiriman</h3>
                <button class="modal-close" data-close-modal="modalKiriman" aria-label="Tutup">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="modalKirimanBody"></div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close-modal="modalKiriman">Tutup</button>
            </div>
        </div>
    </div>

    <script src="dosen.js"></script>
</body>
</html>
