<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Dosen - myITS Classroom</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../dashboard.css">
    <script src="components.js"></script>
</head>
<body>

    <my-topbar></my-topbar>

    <div class="layout-container">
        <my-sidebar active="profile"></my-sidebar>

        <main class="main-content">
            <div class="view-section">

                <div class="page-header">
                    <h2>Pengaturan Profil</h2>
                    <p>Kelola informasi pribadi dan keamanan akun Anda.</p>
                </div>

                <!-- Informasi Akademik -->
                <div class="profile-card">
                    <div class="profile-photo-section">
                        <img src="https://placehold.co/80x80" alt="Foto Profil" class="profile-large-avatar">
                        <div class="photo-actions">
                            <button class="btn-primary-small">Ganti Foto</button>
                            <span class="photo-hint">Ukuran maksimal 2MB. Format JPG atau PNG.</span>
                        </div>
                    </div>

                    <h3 class="section-title">Data Akademik</h3>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Nama Lengkap</label>
                            <input type="text" id="topbar-name-input" value="Dr. Rina Kusumawati, S.Kom., M.T." class="input-readonly" disabled>
                        </div>
                        <div class="input-group">
                            <label>NIP</label>
                            <input type="text" value="197804122005012002" class="input-readonly" disabled>
                        </div>
                        <div class="input-group">
                            <label>Departemen</label>
                            <input type="text" value="Teknik Informatika" class="input-readonly" disabled>
                        </div>
                        <div class="input-group">
                            <label>Email</label>
                            <input type="email" value="rina.kusumawati@its.ac.id" class="input-readonly" disabled>
                        </div>
                    </div>

                    <h3 class="section-title">Informasi Kontak</h3>
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Nomor Telepon</label>
                            <input type="text" placeholder="08xx-xxxx-xxxx">
                        </div>
                        <div class="input-group">
                            <label>Ruang / Kantor</label>
                            <input type="text" placeholder="cth: Gedung Teknik Informatika Lt. 2">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button class="btn-primary-small">Simpan Perubahan</button>
                    </div>
                </div>

                <!-- Ganti Password -->
                <div class="profile-card">
                    <div style="display:flex; align-items:center; gap:10px; margin-bottom:4px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00337F" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <h3 class="section-title" style="margin-top:0;">Ganti Kata Sandi</h3>
                    </div>
                    <p style="font-size:13px; color:#64748B; margin-bottom:4px;">
                        Untuk keamanan akun, jangan gunakan sandi yang sama di beberapa platform.
                    </p>

                    <div class="password-section">
                        <form id="changePasswordForm" novalidate>
                            <div class="password-grid">
                                <div class="input-group">
                                    <label for="oldPassword">Sandi Lama</label>
                                    <div class="password-input-wrapper">
                                        <input type="password" id="oldPassword" placeholder="Masukkan sandi saat ini" autocomplete="current-password">
                                        <button type="button" class="toggle-pass-visibility" aria-label="Tampilkan sandi">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                        </button>
                                    </div>
                                </div>
                                <div class="input-group">
                                    <label for="newPassword">Sandi Baru</label>
                                    <div class="password-input-wrapper">
                                        <input type="password" id="newPassword" placeholder="Minimal 8 karakter" autocomplete="new-password">
                                        <button type="button" class="toggle-pass-visibility" aria-label="Tampilkan sandi">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                        </button>
                                    </div>
                                    <span class="password-hint">Minimal 8 karakter.</span>
                                </div>
                                <div class="input-group">
                                    <label for="confirmPassword">Konfirmasi Sandi Baru</label>
                                    <div class="password-input-wrapper">
                                        <input type="password" id="confirmPassword" placeholder="Ulangi sandi baru" autocomplete="new-password">
                                        <button type="button" class="toggle-pass-visibility" aria-label="Tampilkan sandi">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <p class="classroom-feedback" id="passwordFeedback" role="status" aria-live="polite"></p>
                            <div class="form-actions">
                                <button type="button" class="btn-secondary"
                                    onclick="document.getElementById('changePasswordForm').reset(); document.getElementById('passwordFeedback').className='classroom-feedback'; document.getElementById('passwordFeedback').textContent='';">
                                    Batal
                                </button>
                                <button type="submit" class="btn-primary-small">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
                                    Simpan Sandi Baru
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="dosen.js"></script>
    <script>
        // Tambahkan logika ganti password (sama seperti mahasiswa)
        document.addEventListener("DOMContentLoaded", function () {
            const toggleBtns = document.querySelectorAll(".toggle-pass-visibility");
            toggleBtns.forEach(function (btn) {
                btn.addEventListener("click", function () {
                    const wrapper = this.closest(".password-input-wrapper");
                    if (!wrapper) return;
                    const input = wrapper.querySelector("input");
                    if (!input) return;
                    const isPass = input.type === "password";
                    input.type = isPass ? "text" : "password";
                });
            });
            const form = document.getElementById("changePasswordForm");
            if (form) {
                form.addEventListener("submit", function (e) {
                    e.preventDefault();
                    const oldP = document.getElementById("oldPassword").value;
                    const newP = document.getElementById("newPassword").value;
                    const confP = document.getElementById("confirmPassword").value;
                    const fb = document.getElementById("passwordFeedback");
                    fb.textContent = ""; fb.className = "classroom-feedback";
                    if (!oldP || !newP || !confP) { fb.textContent = "Semua kolom wajib diisi."; fb.className = "classroom-feedback is-visible is-error"; return; }
                    if (newP.length < 8) { fb.textContent = "Sandi baru minimal 8 karakter."; fb.className = "classroom-feedback is-visible is-error"; return; }
                    if (newP !== confP) { fb.textContent = "Konfirmasi sandi tidak cocok."; fb.className = "classroom-feedback is-visible is-error"; return; }
                    fb.textContent = "Kata sandi berhasil diperbarui (simulasi frontend).";
                    fb.className = "classroom-feedback is-visible is-success";
                    this.reset();
                });
            }
        });
    </script>
</body>
</html>
