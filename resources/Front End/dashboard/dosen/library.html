<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan - myITS Classroom</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="../dashboard.css">
    <script src="components.js"></script>
</head>
<body>

    <my-topbar></my-topbar>

    <div class="layout-container">
        <my-sidebar active="library"></my-sidebar>

        <main class="main-content">
            <div class="view-section">

                <div class="library-card">
                    <!-- HEADER: Judul, Search & Tombol Tambah Buku -->
                    <div class="library-header">
                        <div class="library-title">
                            <div class="icon-wrapper">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00337F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                                </svg>
                            </div>
                            <h2>Perpustakaan</h2>
                        </div>

                        <div style="display:flex; align-items:center; gap:12px;">
                            <div class="search-bar">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="11" cy="11" r="8"/>
                                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                </svg>
                                <input type="text" placeholder="Cari judul buku..." id="searchInput">
                            </div>
                            <button class="btn-primary-small" id="btnTambahBuku">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <line x1="12" y1="5" x2="12" y2="19"/>
                                    <line x1="5" y1="12" x2="19" y2="12"/>
                                </svg>
                                Tambah Buku
                            </button>
                        </div>
                    </div>

                    <!-- TABEL BUKU — dirender dosen.js -->
                    <div class="library-table-container" id="libraryTableContainer">
                        <div class="lib-table-header">
                            <div class="col-no">No.</div>
                            <div class="col-title">Judul Buku</div>
                            <div class="col-action" style="width:160px;">Aksi</div>
                        </div>
                        <div id="libraryTableBody">
                            <!-- Dirender oleh dosen.js -->
                        </div>
                    </div>

                    <!-- PAGINASI -->
                    <div class="pagination-wrapper" id="libraryPagination">
                        <!-- Dirender oleh dosen.js -->
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- ========================================================
         MODAL: Tambah Buku
    ======================================================== -->
    <div class="modal-overlay" id="modalTambahBuku" role="dialog" aria-modal="true" aria-labelledby="modalBukuTitle">
        <div class="modal-box" style="max-width:540px;">
            <div class="modal-header">
                <h3 id="modalBukuTitle">Tambah Buku ke Perpustakaan</h3>
                <button class="modal-close" data-close-modal="modalTambahBuku" aria-label="Tutup">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="inputBukuJudul">Judul Buku</label>
                    <input type="text" id="inputBukuJudul" class="form-input" placeholder="cth: Operating System Concepts, 10th Ed.">
                </div>
                <div class="form-group">
                    <label for="inputBukuPenulis">Penulis / Pengarang</label>
                    <input type="text" id="inputBukuPenulis" class="form-input" placeholder="cth: Silberschatz, Galvin, Gagne">
                </div>
                <div class="form-group">
                    <label for="inputBukuFile">File Buku (PDF)</label>
                    <input type="file" id="inputBukuFile" accept=".pdf" style="display:none;">
                    <!-- Area drop / klik -->
                    <label class="classroom-dropzone" for="inputBukuFile" id="bukuDropzone" tabindex="0"
                        style="cursor:pointer; display:flex; align-items:center; gap:12px; padding:16px; border:1px dashed #CBD5E1; border-radius:8px; background:#F8FAFC; transition:all 0.15s;">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 16V4m0 0L7 9m5-5 5 5"/>
                            <path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>
                        </svg>
                        <span style="font-size:13px; color:#64748B; line-height:1.5;">
                            <strong style="color:#475569;">Klik atau seret file PDF di sini</strong><br>
                            Ukuran maksimal 50MB
                        </span>
                    </label>
                    <!-- Preview file terpilih -->
                    <div id="bukuFilePreview" style="display:none; margin-top:8px;" class="selected-file">
                        <span class="selected-file-icon" aria-hidden="true">PDF</span>
                        <span class="selected-file-copy">
                            <span class="selected-file-name" id="bukuFileName">—</span>
                            <span class="selected-file-size" id="bukuFileSize">—</span>
                        </span>
                        <button type="button" class="remove-file-button" id="btnRemoveBukuFile">Hapus</button>
                    </div>
                </div>
                <p id="bukuFeedback" class="classroom-feedback" role="status" aria-live="polite"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close-modal="modalTambahBuku">Batal</button>
                <button class="btn-primary-small" id="btnSaveBuku">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Upload Buku
                </button>
            </div>
        </div>
    </div>

    <!-- Modal konfirmasi hapus buku -->
    <div class="modal-overlay" id="modalHapusBuku" role="dialog" aria-modal="true" aria-labelledby="modalHapusBukuTitle">
        <div class="modal-box" style="max-width:420px;">
            <div class="modal-header">
                <h3 id="modalHapusBukuTitle">Konfirmasi Hapus</h3>
                <button class="modal-close" data-close-modal="modalHapusBuku" aria-label="Tutup">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="hapus-confirm-icon" aria-hidden="true">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#B42318" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                </div>
                <p class="hapus-confirm-text">Buku "<strong id="hapusBukuNama">—</strong>" akan dihapus dari perpustakaan. Tindakan ini tidak dapat dibatalkan.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" data-close-modal="modalHapusBuku">Batal</button>
                <button class="btn-danger" id="btnKonfirmasiHapusBuku">Ya, Hapus Buku</button>
            </div>
        </div>
    </div>

    <script src="dosen.js"></script>
</body>
</html>
